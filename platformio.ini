[platformio]
default_envs = esp32-4827S043R

[env:esp32-4827S043R]
build_src_filter = +<main.cpp> -<relay_test.cpp>
platform = espressif32
board = esp32-4827S043R
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/patch_smartdisplay.py, pre:scripts/build_info.py
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D HEATCONTROL_I2C_SDA=17
    -D HEATCONTROL_I2C_SCL=18
    -D NTC_A0_R25=5000
    -D NTC_A1_R25=10000
    -D NTC_A2_R25=5000
    -D NTC_A0_BETA=3950
    -D NTC_A1_BETA=3950
    -D NTC_A2_BETA=3950
    -D NTC_DIVIDER_R=5000
    -D HEATCONTROL_PCF8574_ADDRESS=0x20
    -D HEATCONTROL_PCF8574_OUTPUTS_ENABLED=0
    -D HEATCONTROL_OTA_PASSWORD=\"Jaguar33__\"

    -D LV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    https://github.com/rzeldent/esp32-smartdisplay.git
    adafruit/Adafruit ADS1X15@^2.5.0
    bblanchon/ArduinoJson@^7.0.0

build_unflags =

; OTA: nach dem ersten USB-Flash und erfolgreicher WLAN-Verbindung
; die beiden Zeilen im OTA-Abschnitt auf die tatsächliche ESP32-IP anpassen.
[env:esp32-4827S043R-ota]
extends = env:esp32-4827S043R
upload_protocol = espota
upload_port = 192.168.0.102
upload_flags =
    --auth=Jaguar33__

; Separater Diagnose-Build: ersetzt voruebergehend HeatControl auf dem ESP32.
; Standard: GPIO-Test ohne Relaisaktivierung (nur Logikpegel).
[env:relay-test]
extends = env:esp32-4827S043R
build_src_filter = -<main.cpp> +<relay_test.cpp>
; Relaisdiagnose ohne LVGL, Smartdisplay und ADS1115
lib_deps =
extra_scripts =
lib_ldf_mode = off
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D RELAY_TEST_GPIO_1=12
    -D RELAY_TEST_GPIO_2=13
    -D RELAY_TEST_ENABLE_DRIVE=1
