[platformio]
default_envs = esp32-4827S043R

[env:esp32-4827S043R]
platform = espressif32
board = esp32-4827S043R
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I include

lib_deps =
    https://github.com/rzeldent/esp32-smartdisplay.git

build_unflags =
